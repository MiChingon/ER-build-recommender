<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Served for any unknown path. On Cloudflare Pages, a top-level 404.html
      also turns off the SPA fallback, so made-up URLs return a real 404
      instead of a 200 copy of the home page (a "soft 404" for crawlers).
    -->
    <meta name="robots" content="noindex" />
    <title>Page not found — Tarnished Builds</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #3a2d12 0%, #14120f 60%);
        color: #e8e2d0; font-family: Georgia, "Times New Roman", serif; text-align: center;
      }
      main { padding: 2rem; max-width: 32rem; }
      img { width: 72px; height: 72px; }
      h1 { color: #f0d682; letter-spacing: 0.08em; font-weight: 600; margin: 1rem 0 0.5rem; }
      p { color: #b8ae96; line-height: 1.5; }
      a {
        display: inline-block; margin-top: 1rem; padding: 0.6rem 1.4rem; border-radius: 999px;
        border: 1px solid rgba(212, 175, 55, 0.6); color: #f0d682; text-decoration: none;
      }
      a:hover { background: rgba(212, 175, 55, 0.12); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Lost in the Lands Between</h1>
      <p>This page doesn't exist. Head back to Tarnished Builds to plan your Elden Ring build.</p>
      <a href="/">Back to the build planner</a>
    </main>
  </body>
</html>
