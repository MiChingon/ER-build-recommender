<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d4af37" />

    <!--
      Content-Security-Policy.
      Production also gets a stricter copy of this policy as an HTTP header
      from the root Caddyfile (adds frame-ancestors, which meta tags can't
      set, and drops the dev-only 'unsafe-inline' script and ws: / wss:).
      Browsers enforce both, so the stricter one wins — keep the two in sync
      when adding a host.
      - script-src: only our own bundle, Google Tag Manager (gtag.js) and
        the Cloudflare Web Analytics beacon. The production header has NO
        'unsafe-inline', so no inline script can run there; it stays in this
        meta copy only because the Vite dev server injects an inline React
        refresh preamble. The gtag bootstrap lives in
        src/components/GoogleAnalytics.tsx (bundled), not inline. JSON-LD
        blocks are data, not executed, so CSP doesn't apply to them.
      - style-src 'unsafe-inline' is required by Motion (framer-motion),
        which animates via inline style attributes.
      - img-src: fextralife hosts for item/class art; Google Analytics
        hosts for GA4's image-beacon fallback.
      - connect-src: Google Analytics / Tag Manager beacons, Cloudflare Web
        Analytics, and ws: / wss: for the Vite dev server's HMR socket
        (meta only — the production header omits them).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: https://eldenring.wiki.fextralife.com https://static0.fextralifeimages.com https://*.google-analytics.com https://*.googletagmanager.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; connect-src 'self' ws: wss: https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self';"
    />

    <!--
      Icons. The inline SVG keeps the crisp in-app emblem in modern tabs; the
      PNG / ICO files exist because search engines only use a crawlable
      raster favicon (≥48px) in results, and browsers/crawlers request
      /favicon.ico directly. Generated from the same emblem.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%231a1714' stroke='%23d4af37' stroke-width='3'/%3E%3Cpath d='M32 12 L32 52 M12 32 L52 32 M19 19 L45 45 M45 19 L19 45' stroke='%23d4af37' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Elden Ring Build Planner & Stat Calculator | Tarnished Builds</title>
    <meta
      name="description"
      content="Free Elden Ring build planner and stat calculator. Get the optimal stats, attack power, status build-up and spells for any class and loadout — DLC included."
    />
    <meta
      name="keywords"
      content="Elden Ring, build planner, build calculator, stat calculator, attack power, status buildup, sorcery scaling, incant scaling, soul level, starting class, weapon scaling, infusion, talisman, armor, Shadow of the Erdtree, Tarnished Edition"
    />
    <meta name="author" content="Tarnished Builds" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://tarnishedbuilds.com/" />

    <!-- Open Graph (Facebook, Discord, Slack previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Tarnished Builds" />
    <meta
      property="og:title"
      content="Elden Ring Build Planner & Stat Calculator | Tarnished Builds"
    />
    <meta
      property="og:description"
      content="Pick a starting class and a weapon loadout — get the optimal stat spread, attack power, status build-up, and a per-level upgrade plan you can download as PDF."
    />
    <meta property="og:url" content="https://tarnishedbuilds.com/" />
    <!-- Self-hosted share card (public/og-image.png, 1200x630). -->
    <meta property="og:image" content="https://tarnishedbuilds.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tarnished Builds — Elden Ring build planner and stat calculator"
    />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Elden Ring Build Planner & Stat Calculator | Tarnished Builds"
    />
    <meta
      name="twitter:description"
      content="Plan an Elden Ring build with optimal stats, AP, status build-up, sorcery / incant scaling, and a per-level upgrade plan."
    />
    <meta name="twitter:image" content="https://tarnishedbuilds.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Tarnished Builds — Elden Ring build planner and stat calculator"
    />

    <!--
      Structured data. WebSite.name is what Google shows as the site name in
      results; WebApplication describes the tool itself.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://tarnishedbuilds.com/#website",
            "name": "Tarnished Builds",
            "alternateName": "Tarnished Builds — Elden Ring Build Planner",
            "url": "https://tarnishedbuilds.com/",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "name": "Tarnished Builds — Elden Ring Build Planner",
            "url": "https://tarnishedbuilds.com/",
            "image": "https://tarnishedbuilds.com/og-image.png",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Web",
            "isAccessibleForFree": true,
            "inLanguage": "en",
            "description": "Pick a starting class and a weapon loadout to see optimal stats, attack power, status build-up, and a per-level upgrade plan. Covers the base game, Shadow of the Erdtree and the Tarnished Edition.",
            "featureList": [
              "Optimal stat spread for a target Soul Level",
              "Best starting class ranking",
              "Attack power per damage type for every affinity",
              "Status build-up",
              "Sorcery and incantation suggestions",
              "Equip load and roll-weight planning",
              "Downloadable PDF level-up plan"
            ],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "isPartOf": { "@id": "https://tarnishedbuilds.com/#website" },
            "about": { "@type": "VideoGame", "name": "Elden Ring" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Tarnished Builds — Elden Ring Build Planner &amp; Stat Calculator</h1>
      <p>
        Tarnished Builds is a free Elden Ring build planner. Pick a starting
        class and up to six weapons, shields or catalysts, choose a target
        Soul Level, and get the optimal stat spread, the best starting class,
        attack power per damage type for every affinity, status build-up,
        sorcery and incantation suggestions, equip-load planning and a
        downloadable PDF level-up plan. It covers the base game, Shadow of the
        Erdtree and the Tarnished Edition (Idus Knight and Heavy Knight).
      </p>
      <p>
        The planner needs JavaScript to run its calculations. Please enable
        JavaScript to continue.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
